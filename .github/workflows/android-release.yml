name: Android Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release tagged v<package version> at the dispatched commit'
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      # All four secrets set: a release-signed APK. None set: a debug-signed
      # APK, so a fork without its own keystore can still publish builds.
      # Some but not all set is a configuration mistake and fails. Debug
      # builds sign with ANDROID_DEBUG_KEYSTORE_BASE64 when it is set, so
      # successive debug releases share a key and update each other.
      - name: Choose signing mode
        id: signing
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ "${#missing[@]}" -eq 0 ]]; then
            echo 'mode=release' >> "$GITHUB_OUTPUT"
          elif [[ "${#missing[@]}" -eq 4 ]]; then
            echo '::warning::No release signing secrets; publishing a debug-signed APK'
            echo 'mode=debug' >> "$GITHUB_OUTPUT"
          else
            for name in "${missing[@]}"; do echo "::error::$name is not configured"; done
            exit 1
          fi

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$app_version"
            exit 1
          fi
          gradle_version="$(sed -n -E 's/^ *versionName "([^"]+)".*/\1/p' android/app/build.gradle)"
          info_version="$(sed -n -E "s/^const VERSION = '([^']+)'.*/\1/p" src/lib/appInfo.ts)"
          if [[ "$gradle_version" != "$app_version" || "$info_version" != "$app_version" ]]; then
            echo "::error::Version mismatch: package.json $app_version, build.gradle $gradle_version, appInfo.ts $info_version"
            exit 1
          fi
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      # A manual publish tags v<version> at this commit. Re-running at the
      # same commit refreshes the assets; an existing tag elsewhere means the
      # version was not bumped, and its release must not be overwritten.
      - name: Check release tag
        if: github.ref_type != 'tag' && inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(git ls-remote origin "refs/tags/v$APP_VERSION^{}" "refs/tags/v$APP_VERSION" | head -n 1 | cut -f 1)"
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::v$APP_VERSION is already tagged at $tag_sha; bump the version before publishing"
            exit 1
          fi

      - name: Install Muya dependencies
        run: pnpm --dir third_party/muya install

      - name: Run release source gates
        run: |
          pnpm lint
          pnpm test
          pnpm test:muya
          pnpm build

      - name: Sync Capacitor Android assets
        run: pnpm exec cap sync android

      - name: Decode release keystore
        if: steps.signing.outputs.mode == 'release'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/marktext-release.jks"
          chmod 600 "$RUNNER_TEMP/marktext-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.mode == 'release'
        env:
          ANDROID_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/marktext-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android testDebugUnitTest assembleRelease --no-daemon

      - name: Install shared debug keystore
        if: steps.signing.outputs.mode == 'debug'
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo '::warning::No ANDROID_DEBUG_KEYSTORE_BASE64; this APK is signed with a one-off debug key'
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug-signed APK
        if: steps.signing.outputs.mode == 'debug'
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android testDebugUnitTest assembleDebug --no-daemon

      - name: Verify signature and prepare artifacts
        id: artifact
        shell: bash
        env:
          # The release certificate pin lives in a repository variable so each
          # fork pins its own key; without it the signature is only verified.
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          EXPECTED_DEBUG_CERT_SHA256: ${{ vars.ANDROID_DEBUG_CERT_SHA256 }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING_MODE" == 'release' ]]; then
            source_apk='android/app/build/outputs/apk/release/app-release.apk'
            apk_name="marktext-android-v${APP_VERSION}.apk"
          else
            source_apk='android/app/build/outputs/apk/debug/app-debug.apk'
            apk_name="marktext-android-v${APP_VERSION}-debug.apk"
          fi
          artifact_dir='release-artifacts'
          mkdir -p "$artifact_dir"
          cp "$source_apk" "$artifact_dir/$apk_name"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo '::error::apksigner was not found in ANDROID_HOME'
            exit 1
          fi

          signer_output="$("$apksigner" verify --verbose --print-certs "$artifact_dir/$apk_name")"
          printf '%s\n' "$signer_output"
          actual_cert_sha256="$(printf '%s\n' "$signer_output" \
            | sed -n -E 's/^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]')"
          if [[ "$SIGNING_MODE" == 'release' && -n "$EXPECTED_CERT_SHA256" \
            && "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Release certificate mismatch: $actual_cert_sha256"
            exit 1
          fi
          if [[ "$SIGNING_MODE" == 'debug' && -n "$EXPECTED_DEBUG_CERT_SHA256" \
            && "$actual_cert_sha256" != "$EXPECTED_DEBUG_CERT_SHA256" ]]; then
            echo "::error::Debug certificate mismatch: $actual_cert_sha256"
            exit 1
          fi
          echo "Signing certificate SHA-256: $actual_cert_sha256"

          (
            cd "$artifact_dir"
            sha256sum "$apk_name" > "$apk_name.sha256"
          )
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marktext-android-v${{ env.APP_VERSION }}
          path: release-artifacts/
          retention-days: 30
          if-no-files-found: error

      # A pushed v*.*.* tag releases that tag. A manual run with `publish`
      # creates the v<package version> tag at the dispatched commit itself.
      - name: Create or update GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          apk_path="release-artifacts/${{ steps.artifact.outputs.apk_name }}"
          checksum_path="$apk_path.sha256"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"
            target_args=(--verify-tag)
          else
            tag="v$APP_VERSION"
            target_args=(--target "$GITHUB_SHA")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk_path" "$checksum_path" --clobber
          else
            notes=''
            if [[ "$SIGNING_MODE" == 'debug' ]]; then
              notes='Debug build (no release keystore is configured): it installs as a separate app, io.github.renakoni.marktextandroid.debug, next to any release install. It updates only debug installs signed with the same debug key.'
            fi
            gh release create "$tag" \
              "$apk_path" \
              "$checksum_path" \
              "${target_args[@]}" \
              --generate-notes \
              --notes "$notes" \
              --title "MarkText for Data Dynamics Inc $tag"
          fi
